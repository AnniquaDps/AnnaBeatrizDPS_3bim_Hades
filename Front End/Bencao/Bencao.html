<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserção de Benções</title>
    <link rel="stylesheet" href="Bencao.css">
</head>

<body>
    <div class="total">
        <h1>Inserção de Benções</h1>
        <div class="area-crud">
            <div class="lado-esquerdo">
                <div class="informacoes">
                    <div class="id-bencao">
                        <label for="id_bencao">
                            Insira o ID da benção:
                        </label>
                        <input type="number" id="id_bencao" name="id_bencao">
                    </div>
                    <div class="linha-id">
                        <input type="button" value="Procure" id="btProcure" onclick="procure()">
                        <input type="button" value="Inserir" id="btInserir" onclick="inserir()" style="display:none;">
                        <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
                        <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">
                    </div>
                    <label for="nome_bencao">
                        Nome da benção:
                    </label>
                    <input type="text" id="nome_bencao" name="nome_bencao">
                    <label for="selectId_deus">Deus:</label>
                        <select name="selectId_deus" id="selectId_deus" disabled>
                            <option value="">Carregando...</option>
                        </select>
                    <label for="efeito_bencao">
                        Efeito da benção:
                    </label>
                    <input type="text" id="efeito_bencao" name="efeito_bencao">
                    <div class="botoes-acao">
                        <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
                        <input type="button" value="Cancelar" id="btCancelar" onclick="cancelar()"
                            style="display:none;">
                    </div>
                </div>
                <div class="lista-bencaos">
                    <h2>bencaos já inseridos:</h2>
                    <div id="RespostaListar"></div>
                </div>
            </div>
            <aside class="form-direita">
                <h2>
                    Imagem da benção
                </h2>
                <p class="instrucao-imagem">
                    (Clique na imagem para alterar)
                </p>
                <div class="img-container">
                    <img id="img_bencao" src="/public/hades imagens/silhueta.png" onclick="acionarUpload()">
                    <input type="file" id="inputImagem" accept="image/*" style="display:none;"
                        onchange="previewImagem()">
                </div>
            </aside>
        </div>
    </div>
    </div>
    <div id="popupAviso" class="popup-aviso">
        <button id="fecharAviso" class="fechar-aviso">
            X
        </button>
        <p id="mensagemAviso"></p>
    </div>
    <script src="Bencao.js"></script>
</body>
</html>
